<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5eee6;
        margin: 0;
        padding: 40px;
        text-align: center;
    }

    h1 {
        color: #593b2a;
    }

    .card {
        background-color: white;
        width: 300px;
        margin: 30px auto;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 10px #cccccc;
    }

    .card img {
        width: 100%;
        border-radius: 10px;
    }

    .price {
        color: #8b5e3c;
        font-size: 22px;
        font-weight: bold;
    }

    button {
        background-color: #593b2a;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 8px;
        cursor: pointer;
    }

    button:hover {
        background-color: #8b5e3c;
    }
</style>

</head>

<body>

<h1>Coffee Shop</h1>
<p>Different flavors of delicious coffe:] </p>

<div class="card">

    <img
    src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Ballerina_Cappuccina.png"
    alt="Cup of coffee"
>
      

    <h2>Cappuccino</h2>

    <p class="price">990KZT</p>

    <p>
        A delicious cappuccino made with espresso
        and creamy steamed milk.
    </p>

    <button type="button">Order Now</button>

</div>
